<text x='248.03' y='50.27' text-anchor='middle' style='font-size: 6.54px; font-family: "Arial";' textLength='74.69px' lengthAdjust='spacingAndGlyphs'>Is grade prognostic at all?</text>
<text x='248.03' y='59.30' text-anchor='middle' style='font-size: 6.54px; font-family: "Arial";' textLength='96.80px' lengthAdjust='spacingAndGlyphs'>What is the grade trend made of?</text>
<text x='248.03' y='116.88' text-anchor='middle' style='font-size: 6.54px; font-family: "Arial";' textLength='69.25px' lengthAdjust='spacingAndGlyphs'>Grade is not prognostic.</text>
<text x='248.03' y='125.91' text-anchor='middle' style='font-size: 6.54px; font-family: "Arial";' textLength='72.14px' lengthAdjust='spacingAndGlyphs'>The trend is proliferation.</text>
