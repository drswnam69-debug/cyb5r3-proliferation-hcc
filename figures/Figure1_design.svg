<text x='403.05' y='50.27' text-anchor='middle' style='font-size: 6.54px; font-family: "Arial";' textLength='88.47px' lengthAdjust='spacingAndGlyphs'>Does adjusting for proliferation</text>
<text x='403.05' y='59.30' text-anchor='middle' style='font-size: 6.54px; font-family: "Arial";' textLength='64.89px' lengthAdjust='spacingAndGlyphs'>raise the hazard ratio?</text>
